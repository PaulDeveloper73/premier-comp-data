<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call to Action Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --icon-color: #81ca00; 
            --bg-color: #ffffff;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .cta-container {
            display: grid;
            grid-template-columns: 1fr;
            background-color: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 1200px;
            overflow: hidden;
        }

        .cta-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s ease;
            text-decoration: none;
            cursor: pointer;
        }

        .cta-item:hover {
            background-color: #f8fafc;
        }

        .cta-item:last-child {
            border-bottom: none;
        }

        .cta-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--icon-color);
            flex-shrink: 0;
        }

        .cta-text-content {
            display: flex;
            flex-direction: column;
        }

        .cta-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .cta-subtitle {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-sub);
            line-height: 1.2;
        }

        /* Tablet Breakpoint (3 columns) */
        @media (min-width: 640px) {
            .cta-container {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .cta-item {
                border-right: 1px solid var(--border-color);
            }

            .cta-item:nth-child(3n) {
                border-right: none;
            }

            .cta-item:nth-last-child(-n+3) {
                border-bottom: none;
            }
        }

        /* Desktop Breakpoint (6 columns) */
        @media (min-width: 1024px) {
            .cta-container {
                grid-template-columns: repeat(6, 1fr);
                padding: 6px 0;
            }

            .cta-item {
                border-bottom: none;
                border-right: 1px solid var(--border-color);
                padding: 12px 16px;
                position: relative;
            }

            /* Instead of full-height grid borders, use centered pseudo-elements for an elegant separator look on desktop */
            .cta-item {
                border-right: none; 
            }
            
            .cta-item:not(:last-child)::after {
                content: '';
                position: absolute;
                right: 0;
                top: 25%;
                height: 50%;
                width: 1px;
                background-color: var(--border-color);
            }

            .cta-item:nth-last-child(-n+3) {
                border-bottom: none;
            }
        }
    </style>
</head>
<body>

    <div class="cta-container">
        
        <!-- Item 1: Book Class -->
        <div class="cta-item">
            <div class="cta-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                    <path d="M8 14h.01"></path>
                    <path d="M12 14h.01"></path>
                    <path d="M16 14h.01"></path>
                    <path d="M8 18h.01"></path>
                    <path d="M12 18h.01"></path>
                    <path d="M16 18h.01"></path>
                </svg>
            </div>
            <div class="cta-text-content">
                <span class="cta-title">Book Class</span>
                <span class="cta-subtitle">Reserve your spot</span>
            </div>
        </div>

        <!-- Item 2: Call Us -->
        <div class="cta-item">
            <div class="cta-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
            </div>
            <div class="cta-text-content">
                <span class="cta-title">Call Us</span>
                <span class="cta-subtitle">+256 702 711 066</span>
            </div>
        </div>

        <!-- Item 3: WhatsApp -->
        <div class="cta-item">
            <div class="cta-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </div>
            <div class="cta-text-content">
                <span class="cta-title">WhatsApp</span>
                <span class="cta-subtitle">Chat with us</span>
            </div>
        </div>

        <!-- Item 4: Membership -->
        <div class="cta-item">
            <div class="cta-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8" cy="10" r="2"></circle>
                    <path d="M8 18c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"></path>
                    <line x1="14" y1="10" x2="19" y2="10"></line>
                    <line x1="14" y1="14" x2="19" y2="14"></line>
                </svg>
            </div>
            <div class="cta-text-content">
                <span class="cta-title">Membership</span>
                <span class="cta-subtitle">View Plans</span>
            </div>
        </div>

        <!-- Item 5: Directions -->
        <div class="cta-item">
            <div class="cta-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
            </div>
            <div class="cta-text-content">
                <span class="cta-title">Directions</span>
                <span class="cta-subtitle">Find Us</span>
            </div>
        </div>

        <!-- Item 6: Hours -->
        <div class="cta-item">
            <div class="cta-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            </div>
            <div class="cta-text-content">
                <span class="cta-title">Hours</span>
                <span class="cta-subtitle">6AM - 10PM</span>
            </div>
        </div>

    </div>

</body>
</html>
