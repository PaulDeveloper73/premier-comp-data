<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why Choose Us - Features Grid</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');

        :root {
            --color-heading: #10151bd5;
            --color-gold: #dfa938;
            --color-text-light: #7c889a;
            --font-main: 'Roboto', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: #fbfcfd;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .features-section {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .section-header {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 32px;
            font-weight: 900;
            color: var(--color-heading);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .section-subtitle {
            font-size: 16px;
            font-weight: 500;
            color: var(--color-gold);
        }

        .features-grid {
            display: grid;
            grid-template-columns: 1fr;
            row-gap: 32px;
            column-gap: 40px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Ensure all SVGs inherit the gold color and size */
        .feature-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--color-gold);
        }

        .feature-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .feature-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--color-heading);
        }

        .feature-desc {
            font-size: 12px;
            font-weight: 500;
            color: var(--color-text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Responsive layout for tablets and desktops */
        @media (min-width: 600px) {
            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
