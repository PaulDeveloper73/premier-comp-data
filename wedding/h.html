<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination Weddings Uganda | Luxury Planner</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#D4AF37', onyx: '#1A1A1A' },
                    fontFamily: { display: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-[#FCFAFA] font-sans text-onyx">

    <header class="fixed top-0 w-full z-[100] bg-white/80 backdrop-blur-md border-b border-gray-100 py-4">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="#" class="font-display text-2xl font-bold uppercase tracking-tighter">DW<span class="text-primary italic">Uganda</span></a>
            
            <nav class="hidden xl:flex space-x-6 text-[10px] font-bold uppercase tracking-widest text-gray-500">
                <a href="#" class="hover:text-primary transition">Venues</a>
                <a href="#" class="hover:text-primary transition">Packages</a>
                <a href="#" class="hover:text-primary transition">Real Weddings</a>
                <a href="#" class="hover:text-primary transition">Plan</a>
                <a href="#" class="hover:text-primary transition">Vendors</a>
                <a href="#" class="hover:text-primary transition">Gallery</a>
                <a href="#" class="bg-primary text-white px-6 py-2 rounded-full hover:bg-black transition">Book Consultation</a>
            </nav>

            <div class="flex items-center space-x-4">
                <select id="currency-toggle" class="bg-transparent border-none text-xs font-bold cursor-pointer">
                    <option value="USD">USD ($)</option>
                    <option value="UGX">UGX (Shs)</option>
                </select>
                <div class="relative cursor-pointer group">
                    <span id="fav-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                    <svg class="w-6 h-6 text-primary group-hover:fill-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                </div>
            </div>
        </div>
    </header>

    <a href="https://wa.me/256700000000" class="fixed bottom-8 right-8 z-[999] bg-[#25D366] text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform">
        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
    </a>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // CURRENCY LOGIC
            const RATE = 3800;
            $('#currency-toggle').on('change', function() {
                const currency = $(this).val();
                $('[data-usd-price]').each(function() {
                    const usd = $(this).data('usd-price');
                    const finalPrice = currency === 'UGX' ? (usd * RATE).toLocaleString() : usd.toLocaleString();
                    const symbol = currency === 'UGX' ? 'Shs ' : '$';
                    $(this).html(`<span class="text-xs uppercase">${symbol}</span>${finalPrice}`);
                });
            });

            // FAVORITE SYSTEM (LocalStorage)
            $('.fav-btn').on('click', function() {
                const id = $(this).data('id');
                let favs = JSON.parse(localStorage.getItem('dw_favs')) || [];
                if (!favs.includes(id)) favs.push(id);
                localStorage.setItem('dw_favs', JSON.stringify(favs));
                $('#fav-count').text(favs.length);
            });

            // Init Favs
            const initialFavs = JSON.parse(localStorage.getItem('dw_favs')) || [];
            $('#fav-count').text(initialFavs.length);
        });
    </script>
</body>
</html>
