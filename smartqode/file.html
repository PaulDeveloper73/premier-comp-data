<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartQode | Professional QR Code Management Platform</title>
    <!-- Google Fonts for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .container {
            max-width: 1100px;
            width: 90%;
            margin: 2rem auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            display: flex;
            overflow: hidden;
            flex-direction: row;
        }

        .content-section {
            padding: 4rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1rem;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        p.description {
            font-size: 1.125rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            max-width: 450px;
        }

        .form-group {
            display: flex;
            gap: 0.5rem;
            max-width: 450px;
        }

        input[type="email"] {
            flex: 1;
            padding: 1rem 1.25rem;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="email"]:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .visual-section {
            flex: 1;
            background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            position: relative;
        }

        .qr-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            animation: float 6s ease-in-out infinite;
        }

        .qr-card img {
            width: 200px;
            height: 200px;
            border-radius: 8px;
            background: #fff;
            padding: 10px;
        }

        .qr-card p {
            color: #ffffff;
            margin-top: 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .notify-text {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .content-section {
                padding: 2.5rem;
                align-items: center;
                text-align: center;
            }
            .form-group {
                flex-direction: column;
                width: 100%;
            }
            h1 {
                font-size: 2.5rem;
            }
            .visual-section {
                padding: 3rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Side: Copy and Lead Capture -->
        <div class="content-section">
            <div class="brand">SmartQode</div>
            <h1>The future of QR management.</h1>
            <p class="description">Create, manage, and track QR codes with advanced analytics and enterprise-grade team collaboration. Get early access before we launch.</p>
            
            <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Lead captured! (Hook this up to your backend)');">
                <div class="form-group">
                    <input type="email" placeholder="Enter your work email" required>
                    <button type="submit">Get Early Access</button>
                </div>
            </form>
            <p class="notify-text">Join 1,000+ businesses waiting for launch. No spam.</p>
        </div>

        <!-- Right Side: Visuals -->
        <div class="visual-section">
            <div class="qr-card">
                <!-- Using a live API to generate a placeholder QR code for the visual effect -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://smartqode.com&color=0f172a" alt="SmartQode QR Preview">
                <p>Scan the Future</p>
            </div>
        </div>
    </div>

</body>
</html>
