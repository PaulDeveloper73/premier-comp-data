<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Header</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="school-header print-header">
    <div class="header-container">
      
      <div class="header-left">
        <img src="https://dpsuganda.com/wp-content/uploads/2023/04/Delhi-Public-School-International-Kampala-Uganda.png" alt="DPS Logo" class="school-logo" />
       
      </div>

      <div class="header-middle">
        <button class="cbse-btn">CBSE- Mandatory Public Disclosure</button>
      </div>

      <div class="header-right">
        <p class="affiliation-title">
          Affiliated To Central Board of Secondary Education - New Delhi
        </p>
        
        <div class="affiliation-details">
          <p class="detail-row">
            <span>Affiliation No: 7630001</span>
            <span class="divider">|</span>
            <span>Affiliation Period 2022 - 2027</span>
          </p>
          <p class="detail-row">
            <span>Affiliation Type: Senior Secondary</span>
            <span class="divider">|</span>
            <span>School Code: 90014.</span>
          </p>
        </div>
      </div>

    </div>
  </header>

</body>
</html>
